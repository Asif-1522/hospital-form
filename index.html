<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            min-height: 100vh;
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        div{
            background-color: #ffffff;
            padding: 50px;
            border-radius: 5px;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        img{
            width: 150px;
            margin: auto;
            border: 1px solid black;
        }
        h1{
            text-align: center;
            color: #0f4c75;
        }

        form *{
            padding: 13px;
            border-radius: 5px;
            outline: none;
            max-width: 400px;
        }
        button { 
            background-color: #bfd30f; 
            font-weight: 900;
            font-size: large; 
            cursor: pointer; 
            border: none; 
        }
        #msg.success{color: green;}
        #msg.error{color: red;}
    </style>
</head>
<body>
    <div>
        <form id="hospitalform">

            <h1><b>Patient prescription</b></h1>
            <input type="text" id="name" placeholder="Patient Name" required>
            <input type="number" id="age" placeholder="Patient Age" required>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

              <input type="tel" id="mobile" placeholder="Mobile Number" required>
            <input type="text" id="disease" placeholder="Disease / Problem" required>

            <select id="doctor" required>
                <option value="">Select Doctor</option>
                <option>Dr. Sharma</option>
                <option>Dr. Khan</option>
                <option>Dr. Singh</option>
                <option>Dr. Kumar</option>
                <option>Dr. Pyaare Lal</option>
            </select>
            
            <input type="date" id="date" required>
            <textarea id="address" placeholder="Patient Address"></textarea>
             <button type="submit" id="submitBtn">Submit</button>
            <p id="msg"></p>

        </form>
    </div>
    <script>
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyHFSLgRBSQWYPU4sIbxOeuJ-C7qK2abRJBeDRs9gX_67AwBt5L_iMZ1TtYsodjEZY0/exec" //

  document.getElementById("hospitalform").addEventListener("submit", async function (e) {
    e.preventDefault();

    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    btn.disabled = true;
    btn.textContent = "Submitting...";
    msg.textContent = "";
    msg.className = "";

    const payload = {
      name:    document.getElementById("name").value.trim(),
      age:     document.getElementById("age").value.trim(),
      gender:  document.getElementById("gender").value,
      mobile:  document.getElementById("mobile").value.trim(),
      disease: document.getElementById("disease").value.trim(),
      doctor:  document.getElementById("doctor").value,
      date:    document.getElementById("date").value,
      address: document.getElementById("address").value.trim()
    };

    try {
      // ✅ no-cors avoids CORS errors; response is opaque but data still saves
      await fetch(WEBAPP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      msg.textContent = "✅ Patient data submitted successfully!";
      msg.className = "success";
      document.getElementById("hospitalform").reset();

    } catch (err) {
      msg.textContent = "❌ Submission failed. Check your connection.";
      msg.className = "error";
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  });
</script>
</body>
</html>
